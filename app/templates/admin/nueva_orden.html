{% extends "base.html" %}

{% block title %}
Nueva orden | FixDesk
{% endblock %}


{% block content %}

<div class="dashboard">

    <section class="page-header">

        <div>
            <span class="section-label">
                ADMINISTRACIÓN
            </span>

            <h1>Nueva orden de reparación</h1>

            <p>
                Registrá una nueva orden y asignala
                a un técnico.
            </p>
        </div>

        <a
            href="{{ url_for('admin.ordenes') }}"
            class="btn-secondary"
        >
            Volver a órdenes
        </a>

    </section>


    <section class="detail-section">

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <div class="form-group">

                <label for="equipo_id">
                    Equipo
                </label>

                <select
                    id="equipo_id"
                    name="equipo_id"
                    required
                >

                    <option value="">
                        Seleccionar equipo
                    </option>

                    {% for equipo in equipos %}

                    <option value="{{ equipo.id }}">
                        {{ equipo.marca }}
                        {{ equipo.modelo }}
                        -
                        {{ equipo.numero_serie }}
                        -
                        {{ equipo.cliente.nombre }}
                        {{ equipo.cliente.apellido }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="tecnico_id">
                    Técnico
                </label>

                <select
                    id="tecnico_id"
                    name="tecnico_id"
                    required
                >

                    <option value="">
                        Seleccionar técnico
                    </option>

                    {% for tecnico in tecnicos %}

                    <option value="{{ tecnico.id }}">
                        {{ tecnico.nombre }}
                        {{ tecnico.apellido }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="prioridad">
                    Prioridad
                </label>

                <select
                    id="prioridad"
                    name="prioridad"
                    required
                >
                    <option value="BAJA">
                        BAJA
                    </option>

                    <option
                        value="NORMAL"
                        selected
                    >
                        NORMAL
                    </option>

                    <option value="ALTA">
                        ALTA
                    </option>

                    <option value="URGENTE">
                        URGENTE
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label for="problema_reportado">
                    Problema reportado
                </label>

                <textarea
                    id="problema_reportado"
                    name="problema_reportado"
                    rows="4"
                    placeholder="Describí el problema del equipo..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="observaciones">
                    Observaciones
                </label>

                <textarea
                    id="observaciones"
                    name="observaciones"
                    rows="3"
                    placeholder="Observaciones adicionales..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn-primary"
            >
                Crear orden
            </button>

        </form>

    </section>

</div>

{% endblock %}
