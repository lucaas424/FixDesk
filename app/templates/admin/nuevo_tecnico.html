{% extends "base.html" %}

{% block title %}
Nuevo técnico | FixDesk
{% endblock %}


{% block content %}

<div class="dashboard">

    <section class="page-header">

        <div>

            <span class="section-label">
                ADMINISTRACIÓN
            </span>

            <h1>
                Nuevo técnico
            </h1>

            <p>
                Registrá un nuevo usuario con rol técnico.
            </p>

        </div>

        <a
            href="{{ url_for('admin.tecnicos') }}"
            class="btn-secondary"
        >
            Volver a técnicos
        </a>

    </section>


    <section class="detail-section">

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <div class="form-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                >

            </div>


            <div class="form-group">

                <label for="apellido">
                    Apellido
                </label>

                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="tecnico@fixdesk.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-primary"
            >
                Registrar técnico
            </button>

        </form>

    </section>

</div>

{% endblock %}
