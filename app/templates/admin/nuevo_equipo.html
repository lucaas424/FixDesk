{% extends "base.html" %}

{% block title %}
Nuevo equipo | FixDesk
{% endblock %}


{% block content %}

<div class="dashboard">

    <section class="page-header">

        <div>
            <span class="section-label">
                ADMINISTRACIÓN
            </span>

            <h1>
                Nuevo equipo
            </h1>

            <p>
                Registrá un nuevo equipo y asocialo a un cliente.
            </p>
        </div>

        <a
            href="{{ url_for('admin.equipos') }}"
            class="btn-secondary"
        >
            Volver a equipos
        </a>

    </section>


    <section class="detail-card">

        <form
            method="POST"
            action="{{ url_for('admin.nuevo_equipo') }}"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <div class="form-group">

                <label for="cliente_id">
                    Cliente
                </label>

                <select
                    id="cliente_id"
                    name="cliente_id"
                    required
                >

                    <option value="">
                        Seleccionar cliente
                    </option>

                    {% for cliente in clientes %}

                    <option value="{{ cliente.id }}">
                        {{ cliente.nombre }}
                        {{ cliente.apellido }}
                        - {{ cliente.email }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="tipo">
                    Tipo
                </label>

                <select
                    id="tipo"
                    name="tipo"
                    required
                >

                    <option value="">
                        Seleccionar tipo
                    </option>

                    <option value="NOTEBOOK">
                        NOTEBOOK
                    </option>

                    <option value="CELULAR">
                        CELULAR
                    </option>

                    <option value="TABLET">
                        TABLET
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="marca">
                    Marca
                </label>

                <input
                    type="text"
                    id="marca"
                    name="marca"
                    placeholder="Ej.: HP"
                    required
                >

            </div>


            <div class="form-group">

                <label for="modelo">
                    Modelo
                </label>

                <input
                    type="text"
                    id="modelo"
                    name="modelo"
                    placeholder="Ej.: Pavilion 15"
                    required
                >

            </div>


            <div class="form-group">

                <label for="numero_serie">
                    Número de serie
                </label>

                <input
                    type="text"
                    id="numero_serie"
                    name="numero_serie"
                    placeholder="Ej.: HP-001"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-primary"
            >
                Registrar equipo
            </button>

        </form>

    </section>

</div>

{% endblock %}
